# ==============================================================================
# CodeMate AI — Production Orchestration (docker-compose.yml)
# High-concurrency production stack with PostgreSQL, Redis cache, and FastAPI.
# ==============================================================================

version: '3.8'

services:
  # --- CodeMate AI Core API Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codemate-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://app.codemateai.com,https://codemateai.com}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://codemate:${POSTGRES_PASSWORD:-codemate_secure_password}@postgres:5432/codemate}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://codemate:${POSTGRES_PASSWORD:-codemate_secure_password}@postgres:5432/codemate}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - MAX_REQUEST_SIZE_BYTES=1048576
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - codemate_backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Production PostgreSQL Relational Store ---
  postgres:
    image: postgres:16-alpine
    container_name: codemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemate_secure_password}
      POSTGRES_DB: codemate
    ports:
      - "5432:5432"
    volumes:
      - codemate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemate -d codemate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  codemate_postgres_data:
    driver: local
  codemate_backend_data:
    driver: local
