# ==============================================================================
# CodeMate AI — Render Deployment Blueprint (render.yaml)
# Production Web Service connected to external Neon Serverless PostgreSQL
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: codemate-backend
    runtime: python
    region: singapore # Closest to India and your Neon DB region (ap-southeast-1)
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install asyncpg
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://codemateai.com,https://app.codemateai.com,chrome-extension://*
      
      # External Neon PostgreSQL Database Connection URL
      - key: DATABASE_URL
        sync: false

      # Authentication & Security
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # AI Provider Configurations
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      - key: OPENROUTER_API_KEY
        sync: false

      # Razorpay Gateway
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Email & Notifications (Optional Resend / SMTP)
      - key: EMAIL_PROVIDER
        value: resend
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: onboarding@resend.dev
