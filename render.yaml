# ==============================================================================
# CodeMate AI — Render Multi-Service Production Blueprint (render.yaml)
# Full 3-Tier Production Architecture:
# 1. codemate-backend (FastAPI REST service connected to Neon Serverless PostgreSQL)
# 2. codemate-frontend (Next.js 16 App Router SaaS platform with proxy.ts & shadcn)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: codemate-backend
    runtime: python
    region: singapore # ap-southeast-1 region
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install asyncpg
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_URL
        value: https://codemate-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://codemateai.com,https://app.codemateai.com,https://codemate-frontend.onrender.com,http://localhost:3000,chrome-extension://*
      
      # External Neon PostgreSQL Database Connection URL
      - key: DATABASE_URL
        sync: false

      # Authentication & Security
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      # AI Provider Configurations
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      - key: OPENROUTER_API_KEY
        sync: false

      # Razorpay Gateway
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Email & Notifications (Optional Resend / SMTP)
      - key: EMAIL_PROVIDER
        value: resend
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: onboarding@resend.dev

  # ----------------------------------------------------------------------------
  # Frontend Web Platform (Next.js 16 + Tailwind CSS 4 + Shadcn)
  # ----------------------------------------------------------------------------
  - type: web
    name: codemate-frontend
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://codemate-backend-wsi1.onrender.com
      - key: BACKEND_URL
        value: https://codemate-backend-wsi1.onrender.com
