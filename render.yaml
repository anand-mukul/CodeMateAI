# ==============================================================================
# CodeMate AI — Render Deployment Blueprint (render.yaml)
# Defines Web Service & Managed PostgreSQL Database for 1-click cloud deployment.
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  - name: codemate-db
    databaseName: codemate
    user: codemate
    region: oregon # or singapore / frankfurt
    plan: free # Can be upgraded to starter in production

services:
  - type: web
    name: codemate-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://codemateai.com,https://app.codemateai.com,chrome-extension://*
      - key: DATABASE_URL
        fromDatabase:
          name: codemate-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: codemate-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: onboarding@resend.dev

